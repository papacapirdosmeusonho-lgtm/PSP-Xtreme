
name: Build PSP-Xtreme Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Download source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android dependencies
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platforms;android-37" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleNormalRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PSP-Xtreme-Android-APK
          path: android/build/outputs/apk/normal/release/*.apk
          if-no-files-found: error
          retention-days: 7
